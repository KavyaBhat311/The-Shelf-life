<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Library Builder</title>
  <link rel="stylesheet" href="../styles/layout.css">
  
</head>
<body>
  <main class="app">
    <!-- Left sidebar -->
    <aside class="left-panel">
      <button class="panel-button logo-button" style="font-family: Times New Roman, Times, serif;">My Shelf Life</button>

      <section class="shelf-picker">
        <div class="section-title" style="font-size: 15px; font-family: Times New Roman, Times, serif;">Choose Shelf</div>
        <div class="shelf-grid">
          <button class="shelf-option" aria-label="Shelf 1"></button>
          <button class="shelf-option" aria-label="Shelf 2"></button>
          <button class="shelf-option" aria-label="Shelf 3"></button>
          <button class="shelf-option" aria-label="Shelf 4"></button>
          <button class="shelf-option" aria-label="Shelf 5"></button>
          <button class="shelf-option" aria-label="Shelf 6"></button>
        </div>
      </section>

      <button class="panel-button" style="font-size: 15px; font-family: Times New Roman, Times, serif;">Shelf size</button>
      <button class="panel-button" style="font-size: 15px; font-family: Times New Roman, Times, serif;">Shelf color</button>
      <button class="panel-button" style="font-size: 15px; font-family: Times New Roman, Times, serif;">Furniture</button>
      <button class="panel-button" style="font-size: 15px; font-family: Times New Roman, Times, serif;">Decor</button>
      <button class="panel-button" style="font-size: 15px; font-family: Times New Roman, Times, serif;">Wall &amp; Floor</button>
    </aside>

    <!-- Main display -->
    <section class="workspace">
      <div class="display" style="font-family: Times New Roman, Times, serif;">Display</div>
      <div class="options-scroll" style="font-family: Times New Roman, Times, serif;">Options Scroll</div>
    </section>

    <!-- Right sidebar -->
    <aside class="right-panel">
      <button class="panel-button" style="font-size: 20px; color: rgb(188, 187, 186);"> &#10226; &#10227;</button>
      <button class="panel-button" style="font-size: 30px;">&#129529;</button>
      <button class="panel-button" style="font-size: 20px;">&#128465;</button>
      <button class="panel-button" style="font-size: 20px;">&#128065;</button>
      <button class="panel-button" style="font-size: 20px; color: rgb(162, 160, 157);">+ &#128218;</button>
      <button class="panel-button" style="font-size: 20px;">🐱 🐾 🐶</button>
      <button class="panel-button" style="font-size: 20px;">&#128229; &#128218;</button>
      <button class="panel-button" style="font-size: 20px; color: rgb(188, 187, 186);">&#9728; | &#9790;</button>
      <button class="panel-button" style="font-size: 15px; color: rgb(188, 187, 186);">🍃 · ☀️ · 🍁 · ❄️ · ☔️</button>
      <button class="panel-button" style="font-size: 22px;">&#128190;</button>
    </aside>
  </main>

  <script src="../js/layout.js"></script>
</body>
</html>
